## Place read-only configurations in this file.
## To define configurations that can later be overridden through UI/API/CLI, add them to `etc/base.hocon`.
##
## Config precedence order:
##   etc/base.hocon < cluster.hocon < emqx.conf < environment variables
##
## See https://docs.emqx.com/en/enterprise/latest/configuration/configuration.html for more information.
## Configuration full example can be found in etc/examples

node {
  name = "emqx@127.0.0.1"
  cookie = "emqx50elixir"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
    listeners {
        http.bind = 18083
        # https.bind = 18084
        https {
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}

actions {
  http {
    staff-chat-alarm-activated {
      connector = discord
      created_at = 1776994242151
      description = "Send Alarm Activated alert to #staff-chat"
      enable = false
      fallback_actions = []
      last_modified_at = 1777007214025
      parameters {
        body = """~
          {
            "username": "EMQX Alarm",
            "content": "EMQX alarm activated: ${alarm_name}",
            "embeds":[
              {
                "title": "🚨 EMQX Alarm Triggered",
                "description": "${alarm_message}",
                "color": 15158332,
                "timestamp": "${activated_at_rfc3339}",
                "fields": [
                  { "name": "Alarm", "value": "${alarm_name}", "inline": true },
                  { "name": "Node", "value": "${emqx_node}", "inline": true },
                  { "name": "Activated", "value": "<t:${activated_at_s}:F>", "inline": false }
                ],
                "footer": {
                  "text": "EMQX Monitoring"
                }
              }
            ]
          }~"""
        headers {content-type = "application/json"}
        max_retries = 2
        method = post
        path = "/api/webhooks/unconfigured"
      }
      resource_opts {
        health_check_interval = "15s"
        health_check_interval_jitter = "0ms"
        health_check_timeout = "60s"
        inflight_window = 100
        max_buffer_bytes = "256MB"
        query_mode = async
        request_ttl = "45s"
        worker_pool_size = 16
      }
    }
    staff-chat-alarm-deactivated {
      connector = discord
      created_at = 1776994331947
      description = "Send Alarm Deactivated alert to #staff-chat"
      enable = false
      fallback_actions = []
      last_modified_at = 1777007090690
      parameters {
        body = """~
          {
            "username": "EMQX Alarm",
            "content": "EMQX alarm cleared: ${alarm_name}",
            "embeds": [
              {
                "title": "✅ EMQX Alarm Cleared",
                "color": 3066993,
                "timestamp": "${deactivated_at_rfc3339}",
                "description": "${alarm_message}",
                "fields": [
                  { "name": "Alarm", "value": "${alarm_name}", "inline": true },
                  { "name": "Node", "value": "${emqx_node}", "inline": true },
                  { "name": "Active For", "value": "${active_for_s} seconds", "inline": true },
                  { "name": "Activated", "value": "<t:${activated_at_s}:F>", "inline": false },
                  { "name": "Cleared", "value": "<t:${deactivated_at_s}:F>", "inline": false }
                ],
                "footer": {
                  "text": "EMQX Monitoring"
                }
              }
            ]
          }~"""
        headers {content-type = "application/json"}
        max_retries = 2
        method = post
        path = "/api/webhooks/unconfigured"
      }
      resource_opts {
        health_check_interval = "15s"
        health_check_interval_jitter = "0ms"
        health_check_timeout = "60s"
        inflight_window = 100
        max_buffer_bytes = "256MB"
        query_mode = async
        request_ttl = "45s"
        worker_pool_size = 16
      }
    }
  }
}

authentication = [
  {
    checks = [
      {
        # Allow client connection using uplink or lonewolf username, but only if the clientid matches the regex pattern. 
        # - Meshtastic{Python|Apple|Android}MqttProxy-<hex-nodeid>
        # - Meshtastic{Python|Apple|Android}MqttProxy-!<hex-nodeid>
        # - Meshtastic{Python|Apple|Android}MqttProxy-paho<digits>
        # - meshpoint-<hex-nodeid>
        # - !<hex-nodeid>
        is_match = [
          "regex_match(username, '^(uplink|lonewolf)$')",
          "regex_match(clientid, '^(Meshtastic(Python|Apple|Android)MqttProxy-(!?[A-Fa-f0-9]+|paho[0-9]+)|meshpoint-[A-Fa-f0-9]+|![A-Fa-f0-9]+)$')"
        ]
        result = ignore
      },
      {
        # Deny uplink or lonewolf username from connecting if the clientid does not match the regex pattern above.
        is_match = "regex_match(username, '^(uplink|lonewolf)$')"
        result = deny
      }
    ]
    enable = true
    mechanism = cinfo
  },
  {
    backend = mongodb
    enable = true
    mechanism = password_based

    password_hash_algorithm {
      dk_length = 32
      iterations = 4096
      mac_fun = sha256
      name = pbkdf2
    }

    filter {
      status = "active"
      username = "${username}"
    }

    mongo_type = single
    server = "mongodb:27017"

    srv_record = false
    ssl {
      enable = false
      middlebox_comp_mode = true
      verify = verify_peer
    }
    topology {
      connect_timeout_ms = "20s"
    }

    clientid_override_field = clientid_override
    is_superuser_field = is_superuser
    password_hash_field = password_hash
    salt_field = salt

    pool_size = 8
    use_legacy_protocol = auto
  },
  {
    backend = built_in_database
    enable = true
    mechanism = password_based
    password_hash_algorithm {
      iterations = 101
      mac_fun = sha512
      name = pbkdf2
    }
    user_id_type = username
  }
]

authorization {
  cache {
    enable = true
    excludes = []
    max_size = 32
    ttl = "1m"
  }
  deny_action = ignore
  include_mountpoint = false
  no_match = deny
  node_cache {
    cache_ttl = "1m"
    enable = true
    max_count = 1000000
    max_memory = "100MB"
  }
  sources = [
    {
      type = mongodb
      enable = true

      filter {
        username = "${username}"
      }

      mongo_type = single
      server = "mongodb:27017"

      limit = 1000
      pool_size = 8
      skip = 0
      srv_record = false
      ssl {
        ciphers = []
        depth = 10
        enable = false
        hibernate_after = "5s"
        log_level = notice
        middlebox_comp_mode = true
        reuse_sessions = false
        secure_renegotiate = true
        verify = verify_peer
        versions = [
          "tlsv1.3",
          "tlsv1.2"
        ]
      }
      topology {
        connect_timeout_ms = "20s"
        heartbeat_frequency_ms = "200s"
        max_overflow = 0
      }
      use_legacy_protocol = auto
    },
    {
      enable = true
      path = "${EMQX_ETC_DIR}/acl.conf"
      type = file
    }
  ]
}

connectors {
  http {
    discord {
      connect_timeout = "15s"
      description = "Discord Server"
      enable = true
      enable_pipelining = 100
      headers {content-type = "application/json"}
      max_inactive = "10s"
      pool_size = 8
      pool_type = random
      resource_opts {
        health_check_interval = "15s"
        health_check_timeout = "60s"
        start_after_created = true
        start_timeout = "5s"
      }
      ssl {
        ciphers = []
        depth = 10
        enable = false
        hibernate_after = "5s"
        log_level = notice
        middlebox_comp_mode = true
        reuse_sessions = false
        secure_renegotiate = true
        verify = verify_none
        versions = [
          "tlsv1.3",
          "tlsv1.2"
        ]
      }
      url = "https://discord.com"
    }
  }
}

rule_engine {
  ignore_sys_message = true
  jq_function_default_timeout = "10s"
  rules {
    sys-alarm-activated {
      actions = [
        "http:staff-chat-alarm-activated"
      ]
      description = ""
      enable = false
      sql = """~
        SELECT
          'activated' AS alarm_state,
          name AS alarm_name,
          message AS alarm_message,
          node AS emqx_node,
          activated_at AS activated_at_us,
          int(activated_at / 1000000) AS activated_at_s,
          unix_ts_to_rfc3339(activated_at, 'microsecond') AS activated_at_rfc3339
        FROM
          "$events/sys/alarm_activated"
        WHERE not regex_match(name, '^(action|connector):')~"""
    }
    sys-alarm-deactivated {
      actions = [
        "http:staff-chat-alarm-deactivated"
      ]
      description = ""
      enable = false
      sql = """~
        SELECT
          'deactivated' AS alarm_state,
          name AS alarm_name,
          message AS alarm_message,
          node AS emqx_node,
          activated_at AS activated_at_us,
          deactivated_at AS deactivated_at_us,
          int(activated_at / 1000000) AS activated_at_s,
          int(deactivated_at / 1000000) AS deactivated_at_s,
          int((deactivated_at - activated_at) / 1000000) AS active_for_s,
          unix_ts_to_rfc3339(deactivated_at, 'microsecond') AS deactivated_at_rfc3339
        FROM
          "$events/sys/alarm_deactivated"
        WHERE not regex_match(name, '^(action|connector):')~"""
    }
  }
}
