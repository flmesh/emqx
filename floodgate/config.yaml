# floodgate >= 0.3.0 schema: `channel_policy: "blacklist"` + `channel_blacklist`
# became `zerohop_enabled` + `zerohop_channels`. Same channels as before.
# From 0.6.0 floodgate rejects unknown keys and invalid values at startup.
zerohop_enabled: true
zerohop_channels:
  - "LongTurbo"
  - "LongFast"
  - "LongModerate"
  - "MediumFast"
  - "MediumSlow"
  - "ShortFast"
  - "ShortSlow"
  - "ShortTurbo"
  - "telemetry"
drop_enabled: false
grpc_port: 9000
health_port: 8080
topic_filter: "msh/#"
stats_interval_s: 60
log_level: "INFO"
log_format: "json"
